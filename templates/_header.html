<header class="app-header">
  <div class="app-header__left">
    <h1 class="app-header__title">Подбор исполнителей</h1>

    <div class="view-switcher" role="tablist" aria-label="Режим отображения">
      <button class="view-tab is-active" data-view="map" type="button" role="tab">
        Карта
      </button>
      <button class="view-tab" data-view="widgets" type="button" role="tab">
        Виджеты
      </button>
      <button class="view-tab" data-view="list" type="button" role="tab">
        Список
      </button>
    </div>
  </div>

  <div class="app-header__right">
    <button class="theme-toggle" id="theme-toggle" type="button"
            aria-label="Переключить тему" role="switch" aria-checked="false">
      <span class="theme-toggle__icon theme-toggle__icon--sun">
        <i class="las la-sun"></i>
      </span>
      <span class="theme-toggle__icon theme-toggle__icon--moon">
        <i class="las la-moon"></i>
      </span>
      <span class="theme-toggle__thumb"></span>
    </button>

    <button class="icon-btn" type="button" aria-label="Уведомления">
      <i class="las la-bell"></i>
    </button>

    <div class="avatar" aria-hidden="true">ВФ</div>
  </div>
</header>
