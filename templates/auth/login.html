<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (() => {
      const key = 'procurement-theme';
      let theme = 'light';
      try {
        const saved = localStorage.getItem(key);
        theme = saved === 'dark' || saved === 'light' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (_) { theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.documentElement.style.backgroundColor = theme === 'dark' ? '#121214' : '#f8fafc';
    })();
  </script>
  <title>{{ page_title }} — Подбор контрагентов</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo.svg') }}">
  <link rel="icon" type="image/png" sizes="88x88" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/light.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/dark.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/auth.css') }}">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-copy">
        <span class="auth-kicker">Сервис подбора исполнителей</span>
        <h1>Вход</h1>
        <p>Войдите как заказчик, чтобы создавать заявки и получать подбор исполнителей.</p>
      </div>
      {% if error %}<div class="auth-alert auth-alert--error">{{ error }}</div>{% endif %}
      <form method="post" class="auth-form">
        <label><span>E-mail</span><input type="email" name="email" autocomplete="email" required placeholder="name@company.ru"></label>
        <label class="auth-password-field"><span>Пароль</span><span class="auth-password-wrap" data-password-wrap><input type="password" name="password" data-password-input autocomplete="current-password" required><button type="button" class="auth-password-toggle" data-password-toggle aria-pressed="false">Показать</button></span></label>
        <button class="auth-submit" type="submit">Войти</button>
      </form>
      <p class="auth-foot">Нет аккаунта? <a href="{{ url_for('auth.register') }}">Зарегистрироваться</a></p>
    </section>
  </main>
  <script type="module" src="{{ url_for('static', filename='js/pages/authPage.js') }}"></script>
</body>
</html>
