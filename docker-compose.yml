name: procurement-ready

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 5000
      SECRET_KEY: ${SECRET_KEY:-local-hackathon-secret-change-me}
      LOCAL_LLM_URL: http://ollama:11434/v1/chat/completions
      LOCAL_LLM_MODEL: qwen2.5:3b
      LOCAL_EMBEDDINGS_URL: http://e5:8080/v1/embeddings
      LOCAL_EMBEDDINGS_MODEL: multilingual-e5-base
      LOCAL_AI_TIMEOUT: 8
      OLLAMA_BASE_URL: http://ollama:11434
      CANDIDATE_EMBED_MODEL: all-minilm
      CANDIDATE_AI_TIMEOUT: 15
      DATASET_PATH: /datasets/source.zip
      PROCUREMENT_LIMIT: 1500
      CONTRACTS_PER_SUPPLIER: 50
      YANDEX_TEST_DATA_URL: "${YANDEX_TEST_DATA_URL:-https://disk.yandex.ru/d/CI8l7NXJ_k7HYA/%D0%A2%D0%B5%D1%81%D1%82%D0%BE%D0%B2%D1%8B%D0%B5%20%D0%B4%D0%B0%D0%BD%D0%BD%D1%8B%D0%B5_1140}"
      DADATA_TOKEN: ${DADATA_TOKEN:-}
      DADATA_MAX_COMPANIES: ${DADATA_MAX_COMPANIES:-9900}
      DADATA_WORKERS: ${DADATA_WORKERS:-4}
      GISP_MIRROR_WORKERS: ${GISP_MIRROR_WORKERS:-10}
      GISP_MIRROR_TIMEOUT: ${GISP_MIRROR_TIMEOUT:-8}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./instance:/app/instance
      - ./data:/app/data
      - ./datasets:/datasets:ro
    depends_on:
      ollama:
        condition: service_started
      qwen-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/auth/login', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  qwen-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo '[qwen-init] Жду Ollama...'
        until ollama list >/dev/null 2>&1; do sleep 2; done
        if ollama list | grep -q 'qwen2.5:3b'; then
          echo '[model-init] qwen2.5:3b уже загружена.'
        else
          echo '[model-init] Загружаю qwen2.5:3b...'
          ollama pull qwen2.5:3b
        fi
        if ollama list | grep -q 'all-minilm'; then
          echo '[model-init] all-minilm уже загружена.'
        else
          echo '[model-init] Загружаю all-minilm для FAISS-подбора...'
          ollama pull all-minilm
        fi
    restart: "no"

volumes:
  ollama-data:
